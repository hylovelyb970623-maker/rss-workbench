services:
  backend:
    build: ./backend
    container_name: rss-backend
    environment:
      - TZ=Asia/Shanghai
    env_file:
      - .env
    volumes:
      - rss-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: rss-frontend
    environment:
      - TZ=Asia/Shanghai
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: rss-nginx
    ports:
      - "2455:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  rss-data:
